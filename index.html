<!DOCTYPE html>
<html>
<head>
    <title>Recipe Ingredient Extractor</title>

    <style>

        body{
            font-family:Arial;
            width:500px;
            margin:40px auto;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:20px;
        }

        button{
            padding:12px 20px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<h2>Recipe Ingredient Extractor</h2>

<form
id="recipeForm">

<label>YouTube URL</label>

<input
type="text"
id="youtube_url"
placeholder="https://youtube.com/..."
required>

<label>Servings</label>

<input
type="number"
id="servings"
value="4"
required>

<button type="submit">

Extract Ingredients

</button>

</form>

<script>

document
.getElementById("recipeForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const data={

youtube_url:
document.getElementById("youtube_url").value,

servings:
Number(document.getElementById("servings").value)

};

const response = await fetch(
    "http://localhost:8000/process_recipe",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    }
);

const result=await response.json();

console.log(result);

alert(
JSON.stringify(result,null,2)
);

});

</script>

</body>
</html>
